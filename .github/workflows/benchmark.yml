name: Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Only the baseline job, which runs on already merged
# code, raises its own permissions. The pull request job executes code from the
# branch under review, so it must never hold a writable token.
permissions:
  contents: read

concurrency:
  # Keyed on the pull request when there is one. The previous group used
  # github.ref, which under pull_request_target reports the base branch, so
  # every pull request shared one group with the push to main and cancelled the
  # baseline run.
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  BENCHMARK_DOCS: 10000
  BENCHMARK_DIMS: 128

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # PR Benchmark: measure the branch and hand the numbers off as an artifact.
  # This job runs untrusted code, so it holds no write permission and posts
  # nothing. The comparison and the comment happen in benchmark-comment.yml.
  # ─────────────────────────────────────────────────────────────────────────────
  benchmark-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Performance Comparison
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: memory_limit=2G

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: Detect benchmark profile
        id: profile
        run: |
          SCENARIOS="xs,small"
          if ${{ contains(github.event.pull_request.labels.*.name, 'benchmark-full') }}; then
            SCENARIOS="xs,small,medium,large,highdim"
          fi
          echo "scenarios=$SCENARIOS" >> "$GITHUB_OUTPUT"

      - name: Run benchmark
        run: |
          php benchmark/run.php \
            --profile=ci \
            --scenarios=${{ steps.profile.outputs.scenarios }} \
            --documents=${{ env.BENCHMARK_DOCS }} \
            --dimensions=${{ env.BENCHMARK_DIMS }} \
            --github-bench=pr-benchmark.json

      - name: Record the pull request number
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-pr
          path: |
            pr-benchmark.json
            pr-number.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Main Benchmark: store historical data and refresh the gh-pages baseline.
  # ─────────────────────────────────────────────────────────────────────────────
  benchmark-main:
    # Gate on the event, not on github.ref. Under pull_request_target that ref
    # reported refs/heads/main, so every pull request rewrote the shared
    # baseline with its own numbers.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Store Benchmark History
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: memory_limit=1G

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: Run benchmark
        run: |
          php benchmark/run.php \
            --profile=ci \
            --scenarios=xs,small \
            --documents=${{ env.BENCHMARK_DOCS }} \
            --dimensions=${{ env.BENCHMARK_DIMS }} \
            --github-bench=benchmark-results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPVector Performance
          tool: customBiggerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: docs/benchmark
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Commit baseline to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git worktree add /tmp/gh-pages gh-pages 2>/dev/null || git worktree add /tmp/gh-pages -b gh-pages
          mkdir -p /tmp/gh-pages/docs/benchmark
          cp benchmark-results.json /tmp/gh-pages/docs/benchmark/latest.json
          cd /tmp/gh-pages
          git add docs/benchmark/latest.json
          git diff --cached --quiet || git commit -m "Update benchmark baseline"
          git push origin HEAD:gh-pages
          cd -
          git worktree remove /tmp/gh-pages

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-main
          path: benchmark-results.json
          retention-days: 90
